name: Utsav CI Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify 0 High/Critical Vulnerabilities
        run: npm audit --audit-level=high

      - name: Static Code Analysis (Lint)
        run: npm run lint

      - name: TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Unit & Integration Tests with Coverage (>80%)
        run: npm run test:coverage

      - name: Production Build
        run: npm run build

